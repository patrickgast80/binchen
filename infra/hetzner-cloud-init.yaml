#cloud-config
# Hetzner CX22 bootstrap for Bilulu / binchen.de production
# Target: Ubuntu 24.04 LTS, datacenter NBG1 (Nürnberg)
# Result after first boot:
#   - non-root deploy user with sudo
#   - SSH: key-only auth, root login disabled, password auth off
#   - ufw: deny incoming except 22/tcp, 80/tcp, 443/tcp
#   - fail2ban watching sshd
#   - 2 GB swapfile
#   - unattended-upgrades (security only, auto-reboot 04:00 UTC)
#   - Docker Engine + compose plugin from docker.com
#   - Coolify installer kicked off at the very end (writes /data/coolify)
#
# Replace BEFORE applying:
#   - ssh_authorized_keys[0]   → real public key (CEO uploads to Hetzner Console too)
#   - users[0].name (optional) → keep "deploy" unless the board prefers another name
#
# Apply via Hetzner Console "Cloud-Init / User data" field at server creation.

hostname: bilulu-prod-01
manage_etc_hosts: true
preserve_hostname: false
timezone: Europe/Berlin
locale: en_US.UTF-8

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA__REPLACE_WITH_CEO_PUBLIC_KEY__ board@bilulu

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - htop
  - vim
  - git
  - tmux
  - jq
  - rsync
  - cron

write_files:
  # SSH hardening — drop-in so 50-cloud-init.conf is not fought over.
  - path: /etc/ssh/sshd_config.d/99-bilulu-hardening.conf
    permissions: "0644"
    content: |
      # Bilulu SSH hardening — see infra/HETZNER_SETUP.md
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
      MaxAuthTries 3
      LoginGraceTime 30
      AllowUsers deploy

  # fail2ban jail for sshd.
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      port    = ssh
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime  = 1h

  # Unattended security upgrades — auto-reboot at 04:00 UTC if needed.
  - path: /etc/apt/apt.conf.d/51bilulu-unattended.conf
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

  # Coolify installer wrapper — runs once, idempotent.
  - path: /root/install-coolify.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      if [ -d /data/coolify ]; then
        echo "Coolify already installed under /data/coolify — skipping."
        exit 0
      fi
      curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash

  # Healthcheck helper used in HETZNER_SETUP.md verification step.
  - path: /usr/local/bin/bilulu-health
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      echo "## kernel"
      uname -a
      echo "## ufw"
      ufw status verbose || true
      echo "## fail2ban"
      fail2ban-client status sshd || true
      echo "## docker"
      docker version --format '{{.Server.Version}}' || echo "docker not ready"
      echo "## coolify containers"
      docker ps --filter "label=coolify.managed=true" --format 'table {{.Names}}\t{{.Status}}' || true
      echo "## swap"
      swapon --show

runcmd:
  # 1. SSH: reload with hardening drop-in
  - [systemctl, restart, ssh]

  # 2. UFW: default deny in, allow out, open 22/80/443.
  - [ufw, --force, reset]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]

  # 3. fail2ban
  - [systemctl, enable, --now, fail2ban]

  # 4. 2 GB swapfile (idempotent).
  - bash -c 'if ! swapon --show | grep -q /swapfile; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi'

  # 5. unattended-upgrades
  - [systemctl, enable, --now, unattended-upgrades]

  # 6. Docker Engine from docker.com (official convenience script).
  - bash -c 'if ! command -v docker >/dev/null; then curl -fsSL https://get.docker.com | sh; fi'
  - [systemctl, enable, --now, docker]

  # 7. Coolify — runs last so the box is hardened before the PaaS layer starts.
  - [/root/install-coolify.sh]

final_message: |
  Bilulu CX22 bootstrap complete after $UPTIME.
  Next steps (from a workstation):
    1. ssh deploy@<server-ip>
    2. sudo /usr/local/bin/bilulu-health
    3. Visit http://<server-ip>:8000 → Coolify first-run wizard (HTTP only until DNS+LE).
    4. DNS A record: coolify.bilulu.de → <server-ip>  (board action — see HETZNER_CEO_CHECKLIST.md)
    5. In Coolify, set instance domain → coolify.bilulu.de → Coolify auto-issues Let's Encrypt cert.
