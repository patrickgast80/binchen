name: Coolify Deploy (fallback)

# SECONDARY deploy path. The primary auto-deploy is a host-side poller on the
# Coolify server (cron as user `deploy`, see infra/RUNBOOK.md "Auto-Deploy"
# and infra/hetzner/binchen-autodeploy-poll.sh) — it needs no GitHub secret.
#
# This workflow only becomes active if the repo secret `COOLIFY_PAT` is set
# (never happened as of BIL-2459; mint via CEO). If the secret is missing, the
# job skips cleanly — the poller covers auto-deploy, so no CI failure noise.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coolify-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify redeploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != '' }}
    steps:
      - name: Check secret is present
        id: check
        run: |
          if [ -z "${{ secrets.COOLIFY_PAT }}" ]; then
            echo "COOLIFY_PAT secret is not set — skipping. Ask CEO to add it (see BIL-2397)."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy storefront
        if: steps.check.outputs.has_secret == 'true'
        env:
          COOLIFY_PAT: ${{ secrets.COOLIFY_PAT }}
        run: |
          set -euo pipefail
          curl -sSf -X POST \
            -H "Authorization: Bearer $COOLIFY_PAT" \
            "https://coolify.bilulu.de/api/v1/deploy?uuid=f12ixtdbpa4bl8ks7qe1ln19&force=false"
          echo ""

      - name: Deploy backend
        if: steps.check.outputs.has_secret == 'true'
        env:
          COOLIFY_PAT: ${{ secrets.COOLIFY_PAT }}
        run: |
          set -euo pipefail
          curl -sSf -X POST \
            -H "Authorization: Bearer $COOLIFY_PAT" \
            "https://coolify.bilulu.de/api/v1/deploy?uuid=k3apwpfen4qlb1hc1jdnli6f&force=false"
          echo ""
