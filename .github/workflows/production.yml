name: Production deploy gate

# Production deploys are triggered manually via:
# - Vercel dashboard: Promotions → Promote to Production
# - Render dashboard: binchen-backend → Deploys → Rollback/promote as needed
#
# This workflow runs final checks before a manual production promotion.
# No tokens required — deploys happen through the platform dashboards.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production checks are requested'
        required: true

jobs:
  guard:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Type 'deploy' to proceed."
            exit 1
          fi
          echo "Production deploy checks requested by ${{ github.actor }}"

  final-checks:
    name: Final build checks
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck all
        run: pnpm lint && pnpm typecheck

      - name: Build all
        run: pnpm build

      - name: Remind operator to promote via platform dashboards
        run: |
          echo "====================================================="
          echo "Checks passed. To deploy to production:"
          echo "  Storefront: Vercel dashboard → Deployments → Promote"
          echo "  Backend:    Render dashboard → binchen-backend → Deploys"
          echo "====================================================="
