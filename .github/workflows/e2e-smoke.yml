name: E2E Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL to test against (overrides VERCEL_PREVIEW_URL)'
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run smoke tests
        working-directory: apps/e2e
        env:
          # Priority: manual input → repo-level var → live Vercel deploy fallback
          BINCHEN_PREVIEW_URL: ${{ inputs.preview_url || vars.BINCHEN_PREVIEW_URL || 'https://binchen.vercel.app' }}
          CI: true
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 14
