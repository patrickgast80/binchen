name: Preview checks (CI only)

# Vercel deploys previews automatically via the Vercel GitHub App — no tokens needed.
# This workflow just runs CI checks so the PR shows a green status before Vercel finishes.

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck storefront
        run: pnpm --filter storefront lint && pnpm --filter storefront typecheck

      - name: Lint & typecheck backend
        run: pnpm --filter backend typecheck

      - name: Build storefront
        run: pnpm --filter storefront build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL || 'http://localhost:9000' }}
