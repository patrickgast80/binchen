name: Staging CI (auto-deploy via integrations)

# Vercel auto-deploys the storefront to production/staging on push to main via GitHub App.
# Render auto-deploys the backend on push to main via GitHub integration.
# This workflow just verifies the build passes before those auto-deploys pick it up.

on:
  push:
    branches: [main]

concurrency:
  group: staging-ci
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build verification before auto-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm lint && pnpm typecheck

      - name: Build storefront
        run: pnpm --filter storefront build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL || 'http://localhost:9000' }}

      - name: Build backend
        run: pnpm --filter backend build
