version: '3.8'

# Local smoke-test stack for BIL-1545: brings up the same Medusa image Coolify
# will run, on a throwaway Postgres + Redis. Use `docker compose up backend`
# to verify the production image boots end-to-end (db:migrate + seed + start).
#
#   docker compose up -d db redis                       # infra only (for `pnpm dev`)
#   docker compose --profile smoke up --build backend   # full smoke: build + boot Medusa
#   docker compose down -v                              # drop image + volumes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: binchen
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: binchen_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binchen -d binchen_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Medusa backend — same image Coolify will deploy from `apps/backend/Dockerfile`.
  # Profiled so `docker compose up` without args doesn't build the image for devs
  # who only need the Postgres/Redis sidecars for `pnpm dev`.
  backend:
    profiles: ['smoke']
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: binchen-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://binchen:localdev@db:5432/binchen_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-smoke-jwt-not-for-prod
      COOKIE_SECRET: local-smoke-cookie-not-for-prod
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:7001,http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:7001
      MEDUSA_BACKEND_URL: http://localhost:9000
      # Bootstrap first admin so the smoke test can log into /app
      MEDUSA_ADMIN_EMAIL: admin@binchen.local
      MEDUSA_ADMIN_PASSWORD: localdev-admin
      # PayPal/Brevo intentionally unset — modules degrade to no-op + warn,
      # so the boot path stays green without real credentials.
    ports:
      - '9000:9000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:9000/health || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
