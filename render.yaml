# Render.com Blueprint — Binchen MedusaJS backend
# First-time setup: Dashboard → New → Blueprint → connect github.com/patrickgast80/binchen
# Render auto-deploys the backend on every push to main.

databases:
  - name: binchen-postgres
    databaseName: binchen
    user: binchen
    plan: free          # free for 90 days; upgrade to ~€7/mo before day 90

services:
  - type: web
    name: binchen-backend
    plan: free          # spins down after 15 min idle — fine for pre-launch
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - apps/backend/**
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        - .dockerignore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: binchen-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STORE_CORS
        value: https://binchen.vercel.app
      - key: ADMIN_CORS
        value: https://binchen.vercel.app
      - key: AUTH_CORS
        value: https://binchen.vercel.app
      - key: MEDUSA_BACKEND_URL
        sync: false       # set after first deploy once URL is known (e.g. https://binchen-backend.onrender.com)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false       # add when payment goes live; leave blank until then
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
