# Render.com Blueprint — Binchen MedusaJS backend
# First-time setup: Dashboard → New → Blueprint → connect github.com/patrickgast80/binchen
# Render auto-deploys the backend on every push to main.

databases:
  - name: binchen-postgres
    databaseName: binchen
    user: binchen
    plan: free          # free for 90 days; upgrade to ~€7/mo before day 90

services:
  - type: web
    name: binchen-backend
    plan: free          # spins down after 15 min idle — fine for pre-launch
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - apps/backend/**
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        - .dockerignore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: binchen-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: STORE_CORS
        value: https://binchen.vercel.app
      - key: ADMIN_CORS
        value: https://binchen.vercel.app
      - key: AUTH_CORS
        value: https://binchen.vercel.app
      - key: MEDUSA_BACKEND_URL
        sync: false       # set after first deploy once URL is known (e.g. https://binchen-backend.onrender.com)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # BIL-124 PayPal-only. The Medusa payment module activates when CLIENT_ID
      # and CLIENT_SECRET are both set; sandbox vs. live is driven by PAYPAL_MODE.
      - key: PAYPAL_CLIENT_ID
        sync: false       # board provides; sandbox first, swap to live for go-live
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false       # set after webhook registered in PayPal developer dashboard
      - key: PAYPAL_MODE
        value: sandbox    # change to "live" on go-live cutover
      # BIL-32 transactional email via Brevo. Module degrades to no-op + warn
      # when these are unset, so deploys stay green until DNS/API key land.
      - key: BREVO_API_KEY
        sync: false       # set in Render dashboard after Brevo account verified
      - key: BREVO_SENDER_EMAIL
        sync: false       # e.g. noreply@bilulu.de — must be verified in Brevo
      - key: BREVO_SENDER_NAME
        value: Bilulu
      - key: BREVO_ADMIN_EMAIL
        sync: false       # Sabine's inbox for 'Neue Bestellung' notifications
