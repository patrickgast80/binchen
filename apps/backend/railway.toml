[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/backend/Dockerfile"
watchPatterns = ["apps/backend/**", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml"]

[deploy]
preDeployCommand = "/app/node_modules/.bin/medusa db:migrate"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
