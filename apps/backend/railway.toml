[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/backend/Dockerfile"
# watchPatterns tells Railway to redeploy only when backend or root manifests change
watchPatterns = ["apps/backend/**", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml"]

[deploy]
# Run DB migrations before the new container takes traffic
preDeployCommand = "node .medusa/server/src/main.js db:migrate"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
